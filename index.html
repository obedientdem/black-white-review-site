</script><script>'use strict';
function storageGet(key){try{return localStorage.getItem(key)}catch{return null}}
function storageSet(key,value){try{localStorage.setItem(key,value)}catch{}}
const $=s=>document.querySelector(s);
const state={lang:storageGet('bw-language')||'zh',data:structuredClone(window.BW_DEMO),live:false,user:null,csrf:null};
const tr=(zh,en)=>state.lang==='en'?en:zh;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=(o,key)=>o[key+(state.lang==='en'&&o[key+'_en']?'_en':'')]||'';
const safeUrl=url=>/^(assets\/|\/uploads\/|https:\/\/|data:image\/(?:svg\+xml|webp|png|jpeg);base64,)/.test(url||'')?esc(url):'assets/embers.svg';
const image=(o,cls='')=>`<img class="${cls}" src="${safeUrl(o.cover)}" alt="${esc(txt(o,'game')||txt(o,'title'))}" loading="lazy">`;
const date=s=>s?new Date(s).toLocaleDateString(state.lang==='en'?'en-GB':'zh-CN',{timeZone:'UTC'}):'';
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(state.timer);state.timer=setTimeout(()=>$('#toast').style.display='none',5000)}
async function api(path,method='GET',data){if(!state.live)throw Error(tr('当前为示例前台。真实账号和操作请启动本地后端。','Demo frontend. Start the local backend for real accounts and actions.'));const res=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':state.csrf||''},body:data===undefined?undefined:JSON.stringify(data)});let result;try{result=await res.json()}catch{throw Error(tr('服务暂不可用','Service unavailable'))}if(!res.ok)throw Error(result.error||'Request failed');return result}
function renderBody(body){return String(body).split('\n').map(line=>{const im=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(im)return `<figure><img src="${safeUrl(im[2])}" alt="${esc(im[1])}" loading="lazy"><figcaption class="small">${esc(im[1])}</figcaption></figure>`;return line.startsWith('## ')?`<h2>${esc(line.slice(3))}</h2>`:esc(line)}).join('\n')}
function head(zh,en,link){return `<div class="section-head"><h2>${tr(zh,en)}<small>${state.lang==='zh'?en:''}</small></h2>${link?`<a href="#/${link}">${tr('查看全部','View all')} ↗</a>`:''}</div>`}
function card(a){return `<a class="card" href="#/article/${a.id}"><div class="card-image">${image(a)}${a.kind==='review'?`<span class="score">${Number(a.score).toFixed(1)}</span>`:''}</div><div class="meta"><span>${esc(a.platform||a.category)}</span><span>${date(a.published)}</span>${a.demo?`<span>${tr('示例','DEMO')}</span>`:''}</div><h3>${esc(txt(a,'game')||txt(a,'title')).replace(/\n/g,'<br>')}</h3><p>${esc(txt(a,'summary'))}</p></a>`}
function activityStatus(a){const n=Date.now(),start=Date.parse(a.start),end=Date.parse(a.end),draw=Date.parse(a.draw_at);return n<start?tr('即将开始','Upcoming'):n<end?tr('报名中','Open'):n<draw?tr('报名结束','Closed'):tr('已到开奖 / 筛选时间','Draw / selection due')}
function activityCard(a){return `<a class="card" href="#/activity/${a.id}"><div class="card-image">${image(a)}</div><div class="meta"><span class="status">${activityStatus(a)}</span><span>${tr(a.kind==='giveaway'?'游戏抽奖':'测试招募',a.kind==='giveaway'?'GIVEAWAY':'PLAYTEST')}</span><span>${tr('截止','Closes')} ${date(a.end)}</span>${a.demo?`<span>${tr('示例','DEMO')}</span>`:''}</div><h3>${esc(txt(a,'title'))}</h3><p>${esc(txt(a,'description'))}</p></a>`}
function feature(a){return `<a class="feature" href="#/article/${a.id}">${image(a)}<span class="score">${Number(a.score).toFixed(1)}</span><div class="feature-text"><span class="eyebrow">FEATURED REVIEW / ${a.demo?tr('示例精选','DEMO SELECTION'):tr('精选测评','EDITORIAL SELECTION')}</span><h2>${esc(txt(a,'title')).replace(/\n/g,'<br>')}</h2><span class="tag">${esc(a.platform)}</span><span class="tag">${esc(a.category)}</span><p>${esc(txt(a,'summary'))}</p><span class="btn light">${tr('阅读测评','Read review')} ↗</span></div></a>`}
function impact(){const s=state.data.settings;return `<div class="impact"><div><span class="eyebrow">OUR IMPACT</span><p class="scribble">Different players.<br>Different perspectives.</p></div><div><strong>${esc(s.impact)}</strong><span>${tr('累计测评影响量','Historical review reach')}</span></div><div><strong>${esc(s.reviews)}</strong><span>${tr('累计测评数量','Historical reviews')}</span></div><div><strong>${esc(s.groups)}</strong><span>${tr('分众测评组','Review communities')}</span></div></div><p class="small" style="margin-top:-36px;margin-bottom:38px">${esc(txt(s,'metric_note'))} · ${tr('更新','Updated')} ${esc(s.updated)}</p>`}
function home(){const d=state.data,r=d.articles.filter(a=>a.kind==='review'),n=d.articles.filter(a=>a.kind==='news'),s=d.settings,a=r.find(a=>a.id===Number(s.hero_id))||r[0];return `<div class="shell"><div class="hero"><div class="manifesto"><div><span class="eyebrow">INDEPENDENT VOICES / SINCE BW</span><h1>${esc(txt(s,'tagline'))}<br><em>${tr('看见，','Look closer.')}<br>${tr('另一种可能。','See differently.')}</em></h1><p>${esc(txt(s,'intro'))}</p><a class="btn" href="#/reviews">${tr('探索游戏测评','Explore reviews')} ↗</a></div><span class="scribble">Games. Beyond scores.</span></div>${a?feature(a):'<div class="empty">No reviews yet</div>'}</div>${impact()}${head('编辑精选',"EDITOR’S PICK",'reviews')}<div class="picks">${r.slice(1,4).map(card).join('')}</div>${head('最新测评','LATEST REVIEWS','reviews')}<div class="grid">${r.slice().sort((a,b)=>b.published.localeCompare(a.published)).slice(0,4).map(card).join('')}</div></div><section class="dark"><div class="shell columns"><div>${head('近期资讯','LATEST STORIES','news')}${n.slice(0,3).map(a=>`<a class="news-row" href="#/article/${a.id}">${image(a)}<div><span class="eyebrow">${esc(a.category)} / ${tr('示例','DEMO')}</span><h3>${esc(txt(a,'title'))}</h3><span class="small">${date(a.published)} ↗</span></div></a>`).join('')}</div><div>${head('黑白高分榜','HIGH SCORES')}${r.slice().sort((a,b)=>b.score-a.score||b.published.localeCompare(a.published)).slice(0,4).map((a,i)=>`<a class="rank-row" href="#/article/${a.id}"><strong>0${i+1}</strong><div>${esc(a.game)}<br><small>${esc(a.platform)} / ${tr('官方评分 · 示例','EDITOR SCORE · DEMO')}</small></div><strong>${Number(a.score).toFixed(1)}</strong></a>`).join('')}<p class="small">${tr('热门榜单按最近30天真实阅读单独计算；示例不伪造阅读量。','Trending uses real 30-day reads separately. Demo does not invent traffic.')}</p><a href="#/reviews?sort=hot">${tr('查看30天热门','30-day trending')} ↗</a></div></div></section><div class="shell">${head('玩在发行之前','PLAY BEFORE RELEASE','activities')}<div class="grid three">${d.activities.map(activityCard).join('')}</div><div class="contact"><h2>${tr('好游戏，<br>值得被看见。','Good games.<br>Deserve to be seen.')}</h2><div><p>${tr('连接玩家、独立开发者与发行商。让不同的声音，找到自己的观众。','Connecting players, independent creators and publishers. Helping different voices find their audience.')}</p><a class="btn" href="#/business">${tr('与黑白合作','Work with BW')} ↗</a></div></div></div>`}
function listing(kind,query){const all=state.data.articles.filter(a=>a.kind===kind),news=kind==='news';return `<div class="shell"><span class="eyebrow">${news?'THE LATEST / GAME NEWS':'CRITICAL PLAY / GAME REVIEWS'}</span><h1 class="big-title">${tr(news?'游戏资讯':'每一款游戏，<br>都有黑白两面。',news?'Game news':'Every game.<br>More than one side.')}</h1><p class="intro">${tr('独立视角，认真体验。与不同的玩家，一起探索。','Independent perspectives. Thoughtful play. Explore with different players.')}</p>${!news&&all[0]?`<div class="feature" style="height:380px">${feature(all[0]).replace(/^<a class="feature"/,'<a style="display:block;height:100%"')}</div>`:''}<div class="filters"><input id="filter-q" type="search" aria-label="Search" placeholder="${tr('搜索标题或游戏','Search title or game')}" value="${esc(query.get('q')||'')}"><select id="filter-category" aria-label="Category"><option value="">${tr('全部类型','All categories')}</option>${[...new Set(all.map(a=>a.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select>${!news?`<select id="filter-platform" aria-label="Platform"><option value="">${tr('全部平台','All platforms')}</option>${[...new Set(all.map(a=>a.platform))].map(p=>`<option>${esc(p)}</option>`).join('')}</select><select id="filter-min" aria-label="Minimum score"><option value="0">${tr('所有评分','All scores')}</option><option value="8">8.0+</option><option value="9">9.0+</option></select>`:''}<select id="filter-sort" aria-label="Sort"><option value="new">${tr('最新发布','Newest')}</option><option value="score">${tr('官方高分','Editor score')}</option><option value="hot">${tr('30天热门','30-day trending')}</option></select></div><div id="listing" class="grid"></div><p id="hot-note" class="small"></p></div>`}
function updateListing(){if(!$('#listing'))return;const kind=location.hash.startsWith('#/news')?'news':'review',q=$('#filter-q').value.toLowerCase(),category=$('#filter-category').value,platform=$('#filter-platform')?.value,min=Number($('#filter-min')?.value||0),sort=$('#filter-sort').value;let rows=state.data.articles.filter(a=>a.kind===kind&&(!category||a.category===category)&&(!platform||a.platform===platform)&&Number(a.score||0)>=min&&JSON.stringify([a.title,a.title_en,a.game,a.summary]).toLowerCase().includes(q));rows.sort((a,b)=>sort==='score'?b.score-a.score||b.published.localeCompare(a.published):sort==='hot'?(b.views30||0)-(a.views30||0)||b.published.localeCompare(a.published):b.published.localeCompare(a.published));$('#listing').innerHTML=rows.map(card).join('')||`<p class="empty">${tr('没有符合条件的内容','No matching stories')}</p>`;$('#hot-note').textContent=sort==='hot'?tr('统计口径：最近30天阅读次数；示例数据无阅读统计。','Metric: reads in the last 30 days; demo content has no traffic statistics.'):''}
function article(id){const a=state.data.articles.find(x=>x.id===Number(id));if(!a)return missing();const review=a.kind==='review';if(state.live)api(`/articles/${id}/view`,'POST',{}).catch(()=>{});return `<div class="detail-hero">${image(a)}<div class="detail-title"><span class="eyebrow">${esc(a.category)} / ${a.demo?'DEMONSTRATION':'BLACK & WHITE'}</span><h1>${esc(txt(a,'title')).replace(/\n/g,'<br>')}</h1><span>${esc(a.author||'')} · ${date(a.published)}</span>${review?`<span class="score">${Number(a.score).toFixed(1)}</span>`:''}</div></div><div class="shell article-layout"><article>${state.lang==='en'&&!a.body_en?`<div class="notice">English copy is unavailable. Showing the original article.</div>`:''}${a.demo?`<div class="notice">${tr('示例内容及评分，仅用于功能展示，不代表真实游戏评价。','Sample content and score for demonstration; not a real game review.')}</div>`:''}${review?`<div class="proscons"><div><h3>白点 / PROS</h3>${(a.pros||[]).map(p=>`<p>+ ${esc(p)}</p>`).join('')}</div><div><h3>黑点 / CONS</h3>${(a.cons||[]).map(p=>`<p>− ${esc(p)}</p>`).join('')}</div></div>`:''}<div class="article-body">${renderBody(txt(a,'body'))}</div><p class="small">${tr('原文出处','Source')}: ${esc(a.source||tr('待编辑补充','Pending editorial source'))}</p><div class="inline-actions"><button data-action="favorite" data-id="${a.id}">${tr('收藏 / 取消收藏','Save / Unsave')}</button>${review?`<label>${tr('我的评分','My score')} <select id="rating">${Array.from({length:21},(_,i)=>`<option>${(i/2).toFixed(1)}</option>`).join('')}</select></label><button data-action="rate" data-id="${a.id}">${tr('提交评分','Rate')}</button>`:''}</div><div id="interaction"></div><form id="comment-form" data-id="${a.id}"><label class="field">${tr('留下你的看法（先审后显）','Your perspective (moderated)')}<textarea name="body" required maxlength="3000"></textarea></label><button class="btn">${tr('提交评论','Submit comment')}</button></form></article><aside class="aside"><span class="eyebrow">GAME FILE</span><h3>${esc(a.game||txt(a,'title'))}</h3><p>${tr('平台','Platform')}: ${esc(a.platform||'—')}<br>${tr('版本','Version')}: ${esc(a.version||'—')}</p>${gameInfo(a)}<p>${tr('官方评分与玩家评分独立计算。','Editor scores and player ratings are independent.')}</p><a href="#/reviews">← ${tr('返回测评','All reviews')}</a></aside></div>`}
function activities(){return `<div class="shell"><span class="eyebrow">GET INVOLVED / PLAY TOGETHER</span><h1 class="big-title">${tr('下一场冒险，<br>一起出发。','Your next adventure.<br>Starts together.')}</h1><p class="intro">${tr('体验未发行游戏，参与社区活动。规则公开，过程透明。','Discover upcoming games and community events. Clear rules. Transparent processes.')}</p>${head('测试招募','PLAYTEST RECRUITMENT')}<div class="grid three">${state.data.activities.filter(a=>a.kind==='recruitment').map(activityCard).join('')}</div><div style="height:45px"></div>${head('游戏抽奖','GAME GIVEAWAYS')}<div class="grid three">${state.data.activities.filter(a=>a.kind==='giveaway').map(activityCard).join('')}</div></div>`}
function activity(id){const a=state.data.activities.find(x=>x.id===Number(id));if(!a)return missing();return `<div class="detail-hero">${image(a)}<div class="detail-title"><span class="eyebrow">${a.kind==='giveaway'?'GIVEAWAY':'PLAYTEST'}</span><h1>${esc(txt(a,'title'))}</h1></div></div><div class="shell article-layout"><div><p class="article-body">${esc(txt(a,'description'))}</p>${a.demo?`<div class="notice">${tr('示例活动，不收集实际报名，不发放真实奖品。','Demo event; no real applications or prizes.')}</div>`:''}<p><span class="status">${activityStatus(a)}</span></p><p>${tr('开始','Starts')}: ${esc(a.start)}<br>${tr('截止','Closes')}: ${esc(a.end)}<br>${tr('开奖 / 筛选','Draw / selection')}: ${esc(a.draw_at)}<br>${tr('地区','Region')}: ${esc(a.region)} · ${tr('年龄要求','Minimum age')}: ${a.min_age}+</p><form id="entry-form" data-id="${a.id}" data-kind="${a.kind}">${field('region',tr('所在地区代码，如 CN','Region code, e.g. CN'),'text','CN')}${(a.questions||[]).map((q,i)=>field('answer'+i,q)).join('')}${field('message',tr('报名说明','Application notes'),'textarea','',false)}<label class="field check"><input type="checkbox" name="consent" required>${tr('我已阅读活动规则，同意管理员为本次活动处理所填资料。向发行商推荐须另行授权。','I have read the rules and consent to processing for this event. Publisher referral requires separate consent.')}</label><button class="btn">${tr('提交报名','Enter event')} ↗</button></form><div id="draw-results"></div></div><aside class="aside panel"><h3>${tr('参与须知','Before you enter')}</h3><p>${tr('仅限18岁以上、邮箱验证完成的账号。每账号每活动一次；账号唯一不代表真实用户唯一。','Adults only, with verified email. One entry per account per event; an account is not proof of a unique person.')}</p><p>${tr('奖品','Prize')}: ${esc(a.prize)}</p><p>${tr('名额','Places')}: ${a.slots}</p><a href="#/legal/rules">${tr('查看完整活动规则','Event rules')} ↗</a></aside></div>`}
function field(name,label,type='text',value='',required=true){return `<label class="field">${esc(label)}${type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`}</label>`}
function business(){return `<div class="dark"><div class="shell"><span class="eyebrow">FOR PUBLISHERS & INDEPENDENT CREATORS</span><h1 class="big-title">${tr('好游戏，<br>值得被看见。','Good games.<br>Deserve to be seen.')}</h1><p class="intro" style="color:#bbb">${tr('分众玩家，独立声音。从零开始，也能找到对的观众。','Focused communities. Independent voices. Find the right audience, from your very first game.')}</p></div></div><div class="shell">${impact()}<div class="columns"><div class="panel"><span class="eyebrow">FOR PUBLISHERS</span><h2>${tr('精准分众触达','Reach the right players')}</h2><p>${tr('游戏测评、测试招募、社区活动。合作不影响官方评分和编辑判断。','Reviews, playtests and community events. Partnerships do not influence editorial scores or judgment.')}</p><a class="btn" href="#/publisher">${tr('申请发行商认证','Apply as publisher')} ↗</a></div><div class="panel"><span class="eyebrow">FOR INDIES</span><h2>${tr('从零建立声量','Build your first audience')}</h2><p>${tr('向认真体验游戏的人，讲述你的创作。','Share your creation with people who care about play.')}</p></div></div>${head('合作申请','LET’S TALK')}<form id="business-form" class="panel">${field('company',tr('公司 / 工作室','Company / studio'))}${field('game',tr('代表游戏','Game'))}${field('contact',tr('联系邮箱','Contact email'),'email')}${field('message',tr('合作需求','Your brief'),'textarea')}<button class="btn">${tr('提交并在个人中心查看进度','Submit and track in your account')} ↗</button></form>${head('公开合作案例','SELECTED PARTNERSHIPS')}${state.data.settings.cases?.length?`<div class="grid three">${state.data.settings.cases.map(c=>`<div class="panel"><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p></div>`).join('')}</div>`:`<div class="empty">${tr('等待团队提供已获公开授权的真实案例。','Awaiting verified case studies with publication permission.')}</div>`}<p>${tr('联系方式','Contact')}: ${esc(state.data.settings.contact)}</p></div>`}
function about(){return `<div class="shell legal"><span class="eyebrow">DIFFERENT PLAYERS / DIFFERENT PERSPECTIVES</span><h1 class="big-title">${tr('游戏不止一面。','Every game has another side.')}</h1><p class="article-body">${esc(txt(state.data.settings,'intro'))}</p>${head('我们的理念','OUR PERSPECTIVE')}<p>${tr('我们相信，认真游玩、诚实表达，是测评的起点。白点与黑点并存，评分不是体验的全部。商务合作不应改变独立编辑判断。','Thoughtful play and honest writing are our starting point. Strengths and weaknesses coexist. Scores cannot tell the whole story. Partnerships must not alter independent editorial judgment.')}</p>${head('团队与分众网络','OUR COMMUNITIES')}${state.data.settings.team||state.data.settings.communities?`<p class="article-body">${esc(txt(state.data.settings,'team'))}</p><p class="article-body">${esc(txt(state.data.settings,'communities'))}</p>`:`<div class="notice">${tr('团队介绍、分众组名单及数据待运营方核实后发布。','Team details, community directory and metrics will be published after verification.')}</div>`}<p>${tr('联系','Contact')}: ${esc(state.data.settings.contact)}</p></div>`}
function legal(type){const texts={privacy:[tr('隐私政策 · 上线前草案','Privacy policy · launch draft'),tr('本地后端仅为运行账号、内容互动和活动处理必要数据：邮箱、年龄声明、评分、评论与主动提交的活动资料。密码仅保存哈希。商务申请、联系方式和报名记录默认私有。\n\n资料仅用于已告知的目的；向发行商推荐报名资料须取得单独授权。可在账号设置申请删除。备份保留期限、运营主体、第三方处理商、法定权利与联系地址须由运营方在正式收集真实用户数据前补充并审查。\n\n此草案未经法律审核，不代表已具备正式运营条件。','The local backend processes email, adult declaration, ratings, comments and voluntarily submitted event information. Passwords are hashed. Business and applicant records are private by default.\n\nPublisher referral requires separate consent. Account deletion is available in settings. The operator must finalize identity, retention, processors, legal rights and contact details before collecting real users’ data.\n\nThis draft has not undergone legal review.')],terms:[tr('用户协议 · 上线前草案','Terms · launch draft'),tr('账号仅向18岁以上用户开放；年龄声明并非身份核验。请勿发布侵权、攻击或违法内容。评论经审核后公开，违规可被限制账号。官方评分独立于玩家评分与商务合作。\n\n完整的运营主体、争议处理及适用地区条款待上线前审核。法定权利不因本站规则而被剥夺。','Accounts are for adults aged 18+. A declaration is not identity verification. Do not post unlawful or infringing content. Comments are moderated; abusive accounts may be suspended. Editorial scores are independent of player ratings and partnerships.\n\nOperator, dispute handling and jurisdiction terms require review before launch. Statutory rights remain intact.')],rules:[tr('活动规则 · 基础框架','Event rules · framework'),tr('每场活动以详情页的时间、地区、年龄、名额与奖品为准。已验证邮箱账号每场最多报名一次。截止后固定资格，系统公平随机开奖并公布脱敏结果。工作人员人工发放奖品，记录状态；不自动储存或派发游戏密钥。\n\n测试招募由管理员筛选，向发行商推荐需另行授权。账号唯一不等于真人唯一。活动正式发布前须审核运营地区法律、奖项、取消条件与异议处理机制。','Each event specifies its dates, region, age, capacity and prizes. One entry per verified account. Eligibility freezes at the deadline. Winners are randomly selected and published under masked identifiers. Prizes are fulfilled manually; no game keys are stored or automatically sent.\n\nPlaytest applicants are selected by administrators. Publisher referral requires separate consent. Event legality, cancellation terms and disputes need review before launch.')],copyright:[tr('版权投诉与下架','Copyright and takedown'),tr('本版本图像为原创示例插画；文章为显式示例。正式内容必须保留来源并核验图片使用权。\n\n如认为内容侵犯权利，请向下方运营联系地址提供具体网址、权属说明与联系方式。管理员核实后及时限制或下架内容并记录处理。运营联系地址待补充，正式上线前必须完成。','This version uses original sample artwork and explicitly marked demo articles. Published content must retain sources and verified image rights.\n\nSend the operator the specific URL, rights information and contact details for a complaint. Administrators will review and restrict or remove content as appropriate. Operational contact details must be supplied before launch.')]};const [title,body]=texts[type]||texts.terms;return `<div class="shell legal"><h1 class="big-title">${title}</h1><div class="notice">${tr('草案 / 非正式运营法律文件','DRAFT / Not final operational legal documentation')}</div><p class="article-body">${esc(body)}</p><p>${esc(state.data.settings.contact)}</p></div>`}
function account(){return `<div class="shell"><h1 class="big-title">${tr('玩家中心','Player hub')}</h1>${!state.live?`<div class="notice">${tr('GitHub Pages / 本地文件模式仅展示前台。启动后端后，注册、验证和后台编辑才会写入真实数据库。','GitHub Pages / local file mode displays the frontend. Start the backend to enable persistent accounts and administration.')}</div>`:''}<div id="account-content"><div class="columns"><form id="login-form" class="panel"><h2>${tr('登录','Sign in')}</h2>${field('email',tr('邮箱','Email'),'email')}${field('password',tr('密码','Password'),'password')}<button class="btn">${tr('登录','Sign in')} →</button><a href="#/reset">${tr('忘记密码？','Forgot password?')}</a></form><form id="register-form" class="panel"><h2>${tr('加入黑白','Join BW')}</h2>${field('email',tr('邮箱','Email'),'email')}${field('name',tr('公开昵称','Display name'))}${field('password',tr('密码（至少12位）','Password (12+ characters)'),'password')}<label class="field check"><input type="checkbox" name="adult" required>${tr('我已年满18岁，并阅读用户协议与隐私政策。','I am 18+ and have read the terms and privacy policy.')}</label><button class="btn">${tr('注册并验证邮箱','Register & verify email')} →</button></form></div></div></div>`}

function render(){const [path,qs='']=(location.hash.slice(2)||'').split('?'),parts=path.split('/'),query=new URLSearchParams(qs);document.documentElement.lang=state.lang==='en'?'en':'zh-CN';$('#lang').textContent=state.lang==='zh'?'EN':'中文';$('#nav').innerHTML=[['','首页','Home'],['reviews','游戏测评','Reviews'],['news','游戏资讯','News'],['activities','活动中心','Events'],['about','关于我们','About'],['business','商务合作','Partners']].map(([p,z,e])=>`<a href="#/${p}" ${parts[0]===p?'class="active"':''}>${tr(z,e)}</a>`).join('');$('#mode').textContent=state.live?tr('本地后端已连接 · 数据真实保存 · 非正式运营版本','Local backend connected · Persistent data · Not a production launch'):tr('前台展示版 · 内容 / 评分 / 活动均为示例 · 账号功能需要后端服务','FRONTEND DEMO · Sample content, scores and events · Accounts require a backend');$('#account-link').textContent=state.user?tr('个人中心','My account'):tr('登录 / 注册','Sign in');const pages={'':home,reviews:()=>listing('review',query),news:()=>listing('news',query),article:()=>article(parts[1]),activities,activity:()=>activity(parts[1]),business,about,legal:()=>legal(parts[1]),account,publisher,reset:()=>`<div class="shell legal"><h1>${tr('找回密码','Reset password')}</h1><form id="reset-request-form" class="panel">${field('email',tr('邮箱','Email'),'email')}<button class="btn">${tr('发送重置邮件','Send reset email')}</button></form></div>`,verify:()=>`<div class="shell legal"><h1>${tr('验证邮箱','Verify email')}</h1><button data-action="verify" data-token="${esc(query.get('token')||'')}">${tr('确认验证','Confirm verification')}</button></div>`,'new-password':()=>`<div class="shell legal"><h1>${tr('设置新密码','Choose a new password')}</h1><form id="reset-confirm-form" data-token="${esc(query.get('token')||'')}">${field('password',tr('新密码（12位以上）','New password (12+ characters)'),'password')}<button class="btn">${tr('重置密码','Reset password')}</button></form></div>`,admin:()=>adminPage(parts[1]||'articles')};$('#main').innerHTML=(pages[parts[0]]||missing)();$('#footer').innerHTML=`<div><a class="brand" href="#/">黑白测评组< function activityFields(row){return selectField('kind',tr('活动类型','Type'),['recruitment','giveaway'],row.kind||'recruitment')+selectField('status',tr('状态','Status'),['draft','pending','rejected','published','archived'],row.status||'draft')+[['title','标题 / Title'],['title_en','英文标题 / English title'],['cover','封面 / Cover'],['start','开始 ISO日期 / Starts'],['end','截止 ISO日期 / Closes'],['draw_at','开奖 ISO日期 / Draw'],['region','地区代码或ALL / Region or ALL'],['min_age','最低年龄 / Minimum age'],['slots','名额 / Winners'],['prize','奖品 / Prize']].map(([k,l])=>field(k,l,['min_age','slots'].includes(k)?'number':'text',row[k]??({region:'ALL',min_age:18,slots:1,cover:'assets/forest.svg'}[k]||''),k!=='title_en')).join('')+[['description','规则与说明 / Description'],['description_en','英文说明 / English description'],['questions','报名问题（每行一条）/ Questions']].map(([k,l])=>field(k,l,'textarea',Array.isArray(row[k])?row[k].join('\n'):row[k]||'',false)).join('')}

$('#lang').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';storageSet('bw-language',state.lang);render()};$('#menu').onclick=()=>{$('#nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String($('#nav').classList.contains('open')))};$('#search-toggle').onclick=()=>{$('#searchbar').hidden=!$('#searchbar').hidden;if(!$('#searchbar').hidden)$('#search').focus()};$('#search-go').onclick=()=>{location.hash='/reviews?q='+encodeURIComponent($('#search').value);$('#searchbar').hidden=true};$('#search').onkeydown=e=>{if(e.key==='Enter')$('#search-go').click()};$('#close-modal').onclick=()=>$('#modal').close();
document.addEventListener('input',e=>{if(e.target.id.startsWith('filter-'))updateListing()});document.addEventListener('change',e=>{if(e.target.id.startsWith('filter-'))updateListing()});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.matches('form'))return;e.preventDefault();const submit=f.querySelector('button[type=submit],button:not([type])');if(submit)submit.disabled=true;try{const data=Object.fromEntries(new FormData(f));let result;if(f.id==='login-form'){result=await api('/auth/login','POST',data);state.user=result.user;state.csrf=result.csrf;render()}else if(f.id==='register-form'){data.adult=Boolean(data.adult);await api('/auth/register','POST',data);toast(tr('请查看验证邮件。本地开发邮件见 outbox 命令。','Check your verification email. Local development mail is available through the outbox command.'));f.reset()}else if(f.id==='reset-request-form'){await api('/auth/reset-request','POST',data);toast(tr('若账号符合条件，将收到重置邮件。','If eligible, you will receive a reset email.'))}else if(f.id==='reset-confirm-form'){await api('/auth/reset','POST',{...data,token:f.dataset.token});state.user=null;toast(tr('密码已重置，请重新登录','Password reset. Sign in again.'));location.hash='/account'}else if(f.id==='settings-form'){data.hero_id=Number(data.hero_id);data.cases=JSON.parse(data.cases||'[]');await api('/admin/settings','PATCH',data);await refresh();toast(tr('站点设置已保存','Site settings saved'))}else if(f.id==='editor-form'){const resource=f.dataset.resource;if(resource==='articles'){data.score=Number(data.score);data.game_id=Number(data.game_id)||null;data.pros=data.pros.split('\n').filter(Boolean);data.cons=data.cons.split('\n').filter(Boolean);data.demo=Boolean(data.demo)}if(resource==='games')data.platforms=data.platforms.split(',').map(x=>x.trim()).filter(Boolean);if(resource==='activities'){data.min_age=Number(data.min_age);data.slots=Number(data.slots);data.questions=data.questions.split('\n').filter(Boolean)}await api('/'+(f.dataset.publisher?'publisher':'admin')+'/'+resource+(f.dataset.id?'/'+f.dataset.id:''),f.dataset.id?'PATCH':'POST',data);$('#modal').close();await refresh();toast(tr('已保存','Saved'))}else if(f.id==='upload-form'){const file=f.elements.image.files[0];if(file.size>4*1024*1024)throw Error(tr('图片不能超过4MB','Image exceeds 4MB'));const raw=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const uploaded=await api('/admin/upload','POST',{base64:raw});$('#editor-form [name=cover]').value=uploaded.url;toast(tr('图片已上传','Image uploaded'))}else if(f.id==='comment-form'){await api(`/articles/${f.dataset.id}/comments`,'POST',data);f.reset();loadInteractions(f.dataset.id);toast(tr('评论待审核','Comment submitted for moderation'))}else if(f.id==='publisher-form'||f.id==='business-form'){await api(f.id==='publisher-form'?'/publisher/apply':'/business','POST',data);toast(tr('申请已提交，可在个人中心查看','Submitted. Track it in your account.'));location.hash='/account'}else if(f.id==='entry-form'){data.consent=Boolean(data.consent);data.answers=Object.keys(data).filter(k=>k.startsWith('answer')).sort().map(k=>data[k]);await api(`/activities/${f.dataset.id}/enter`,'POST',data);toast(tr('报名成功，可在个人中心查看','Entered. Track status in your account.'))}else if(f.id==='profile-form'){await api('/account','PATCH',data);await refresh();toast(tr('昵称已保存','Name saved'))}else if(f.id==='delete-account-form'){result=await api('/account','DELETE',{password:data.password});state.csrf=result.csrf;state.user=null;render();toast(tr('账户已删除','Account deleted'))}else if(f.id==='manage-form'){if(f.dataset.resource==='users')data.active=Number(data.active);await api(`/admin/${f.dataset.resource}/${f.dataset.id}`,'PATCH',data);$('#modal').close();loadAdmin(f.dataset.resource);toast(tr('处理完成','Updated'))}}catch(error){toast(error.message)}finally{if(submit)submit.disabled=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{const id=b.dataset.id,resource=b.dataset.resource;switch(b.dataset.action){case'favorite':await api(`/articles/${id}/favorite`,'POST',{});toast(tr('收藏状态已更新','Saved state updated'));break;case'rate':await api(`/articles/${id}/rating`,'POST',{score:Number($('#rating').value)});loadInteractions(id);break;case'verify':await api('/auth/verify','POST',{token:b.dataset.token});toast(tr('邮箱已验证，请登录','Email verified. Sign in.'));location.hash='/account';break;case'logout':{const r=await api('/auth/logout','POST',{});state.csrf=r.csrf;state.user=null;render();break}case'resend':await api('/auth/resend','POST',{});toast(tr('验证邮件已重发','Verification mail sent'));break;case'new':editor(resource);break;case'edit':editor(resource,state.adminRows.find(x=>x.id===Number(id)));break;case'archive':await api(`/admin/${resource}/${id}`,'DELETE',{});await refresh();break;case'moderate':await api(`/admin/${resource}/${id}`,'PATCH',{status:b.dataset.status});loadAdmin(resource);break;case'manage-row':manageRow(resource,state.adminRows.find(x=>x.id===Number(id)));break;case'draw':await api(`/admin/activities/${id}/draw`,'POST',{});toast(tr('开奖完成（重复执行返回同一结果）','Draw complete (retries return the same result)'));break;case'referral-consent':await api(`/applications/${id}/consent`,'POST',{});loadAccount();toast(tr('推荐授权状态已更新','Referral consent updated'));break;case'publisher-dashboard':await publisherDashboard();break;case'publisher-new':editor('activities');$('#editor-form').dataset.publisher='1';break;case'publisher-edit':editor('activities',state.publisherRows.find(x=>x.id===Number(id)));$('#editor-form').dataset.publisher='1';break;case'publisher-submit':await api(`/publisher/activities/${id}/submit`,'POST',{});await publisherDashboard();break}}catch(error){toast(error.message)}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();
(async()=>{if(location.protocol==='file:'||location.hostname.endsWith('github.io'))return;try{const res=await fetch('/api/bootstrap',{credentials:'same-origin'});if(!res.ok)return;const boot=await res.json();state.live=true;state.csrf=boot.csrf;state.user=boot.user;state.data=await api('/public');render()}catch{/* Static preview remains usable without a backend. */}})();
window.BW_TEST={esc,safeUrl,txt,state,updateListing};
